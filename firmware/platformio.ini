; Firewatch firmware — ESP32 fire-glow LED controller + Roku ECP scene control.
; Build/flash:   pio run -e esp32 -t upload
; OTA update:    pio run -e esp32-ota -t upload
; Host tests:    pio test -e native

[platformio]
default_envs = esp32

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; HomeSpan + BLE need more room than the default 1.25 MB app slot. min_spiffs keeps two
; 1.9 MB app slots (so OTA still works) and drops the unused SPIFFS area. Changing the
; partition table needs one USB flash; after that, OTA as usual.
board_build.partitions = min_spiffs.csv
lib_deps =
    makuna/NeoPixelBus@2.8.3
    crankyoldgit/IRremoteESP8266@2.8.6
    homespan/HomeSpan@1.9.1
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=0
    ; Firewatch only listens for the lighter: keep NimBLE's observer role, drop the rest.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED

; Over-the-air updates. The password must match OTA_PASSWORD in include/secrets.h; it is
; read from an environment variable so it never lands in this file:
;   PowerShell (once, then restart VS Code):  setx FIREWATCH_OTA_PASSWORD "your-ota-password"
[env:esp32-ota]
extends = env:esp32
upload_protocol = espota
upload_port = firewatch.local
upload_flags = --auth=${sysenv.FIREWATCH_OTA_PASSWORD}

[env:native]
platform = native
test_build_src = no
build_flags =
    ${env.build_flags}
    -lm
